# Build and publish the `vericto` container image to GHCR (§9, Phase 1).
#
# Kept separate from release.yml on purpose: that file is generated by
# `cargo-dist` and `dist generate` would overwrite any hand edits. This workflow
# owns the Docker channel end-to-end.
#
# Triggers on the same version tags as the release pipeline (e.g. v1.2.3 or
# 1.2.3), and can be run manually. Publishes a multi-arch (amd64 + arm64) image
# and attaches a keyless build attestation, matching the provenance story the
# binary artifacts get in release.yml.
name: Docker

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # donkan168/vericto-cli

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v5

      # Emulation so we can build the arm64 image on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels from the git ref: a version tag yields `X.Y.Z`,
      # `X.Y`, and `latest`; anything else just gets the ref/sha.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs to keep the (slow, emulated) arm64 build fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: image build-provenance attestation is intentionally omitted here
      # for the same reason as the binary artifacts (see dist-workspace.toml):
      # GitHub attestations aren't available for user-owned private repos. Add an
      # `actions/attest-build-provenance` step (with `id-token`/`attestations`
      # write permissions) once this repo is public or under an org.

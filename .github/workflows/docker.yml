# Build and publish the `vericto` container image to GHCR (§9, Phase 1).
#
# Kept separate from release.yml on purpose: that file is generated by
# `cargo-dist` and `dist generate` would overwrite any hand edits. This workflow
# owns the Docker channel end-to-end.
#
# Triggers on the same version tags as the release pipeline (e.g. v1.2.3 or
# 1.2.3), and can be run manually. Publishes a multi-arch (amd64 + arm64) image
# and attaches a keyless build attestation, matching the provenance story the
# binary artifacts get in release.yml.
name: Docker

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # vericto/vericto-cli

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the publish job asks for what it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing of the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Emulation so we can build the arm64 image on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels from the git ref: a version tag yields `X.Y.Z`,
      # `X.Y`, and `latest`; anything else just gets the ref/sha.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs to keep the (slow, emulated) arm64 build fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build provenance for the pushed image (same mechanism release.yml uses for the
      # binaries), stored in GHCR next to it. Verify with
      # `gh attestation verify oci://ghcr.io/vericto/vericto-cli:<tag> --repo vericto/vericto-cli`.
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

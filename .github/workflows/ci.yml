# Quality gate for vericto-cli itself (not the `vericto init` template for users).
# Runs on every PR into main and on pushes to main: format, lint, build, test.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning across all jobs.
  RUSTFLAGS: "-D warnings"

# Least privilege for the GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# CI only checks out and builds, so it needs read access to the contents and nothing else.
permissions:
  contents: read

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # libclang for pg_query's bindgen (the `offline` feature embeds the engine).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The Windows build has no engine: keep the feature-off code warning-free.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      # The Windows-shaped build (no engine): `--offline` must exit 2 there.
      - run: cargo test --locked --no-default-features

  # Informational, NOT required: does the embedded engine (pg_query: libpg_query
  # C sources + bindgen) build and pass on Windows? The release ships Windows
  # online-only; `--cfg vericto_windows_offline` lifts the Cargo.toml target
  # gate for this job only. `continue-on-error` keeps a failure here from
  # failing the workflow; do not add this job to the required checks. Once it
  # is green, drop the gate (Cargo.toml, src/offline.rs, tests/cli.rs) and this
  # job's RUSTFLAGS, and Windows gets offline mode in the next release.
  windows-offline:
    name: Windows offline mode (informational)
    runs-on: windows-2022
    continue-on-error: true
    env:
      RUSTFLAGS: "-D warnings --cfg vericto_windows_offline"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The runner image ships LLVM (libclang) and MSVC, as pg_query's own
      # Windows CI relies on.
      - name: Build with the engine
        run: cargo build --locked --all-targets
      # The offline tests first (unit + integration, incl. deep nesting against
      # Windows' 1 MiB main-thread stack), then the whole suite.
      - name: Offline tests
        run: cargo test --locked offline
      - name: Full test suite
        run: cargo test --locked

  # The npm installer's integrity checks (npm-installer/): node:test, no
  # dependencies to install.
  npm-installer:
    name: npm installer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'
      - run: npm test
        working-directory: npm-installer

  # Dependency checks against the committed Cargo.lock: RustSec advisories
  # (vulnerable, unsound, unmaintained or yanked crates), licenses, bans and
  # sources, as configured in deny.toml.
  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # Prebuilt binaries, checksum-verified by the action, so nothing is compiled.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings

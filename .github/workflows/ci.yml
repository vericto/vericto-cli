# Quality gate for vericto-cli itself (not the `vericto init` template for users).
# Runs on every PR into main and on pushes to main: format, lint, build, test.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning across all jobs.
  RUSTFLAGS: "-D warnings"

# Least privilege for the GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# CI only checks out and builds, so it needs read access to the contents and nothing else.
permissions:
  contents: read

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # libclang for pg_query's bindgen (the `offline` feature embeds the engine).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The thin client (no engine): keep the feature-off code warning-free.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev clang
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      # The thin client (no engine): `--offline` must exit 2 there.
      - run: cargo test --locked --no-default-features

  # Windows, with the embedded engine (offline mode ships on Windows since
  # 1.11.0): lint, build and the whole test suite, natively on x64 and on ARM64.
  # A required check, one per runner: "Windows build & test (windows-2022)" and
  # "Windows build & test (windows-11-arm)". clippy runs here too, because the
  # Linux lint job never compiles the cfg(windows) code (the config file's
  # owner-only ACL). Both runner images ship LLVM (libclang, for pg_query's
  # bindgen) and MSVC, so nothing is installed.
  windows:
    name: Windows build & test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build with the engine
        run: cargo build --locked --all-targets
      # The offline tests first (unit + integration, incl. deep nesting against
      # Windows' 1 MiB main-thread stack), then the whole suite.
      - name: Offline tests
        run: cargo test --locked offline
      - name: Full test suite
        run: cargo test --locked
      - name: Thin client (no engine)
        run: cargo test --locked --no-default-features

  # The installers' own tests, node:test with no dependencies to install: the
  # npm installer's integrity checks (npm-installer/) and the Windows packaging
  # (windows/: the PowerShell installer, Scoop and winget manifests). On
  # Windows they also install a .zip through the npm package and run it, and
  # run the rendered PowerShell installer against a good and a tampered
  # archive.
  installers:
    name: Installer tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'
      # The tests call `tar` with Windows paths (C:\...): put Windows' own
      # bsdtar first, ahead of any GNU tar (Git's reads `C:` as a remote host).
      - name: Use the system tar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:SystemRoot\System32" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          tar --version
      - run: npm test
        working-directory: npm-installer
      - run: npm test
        working-directory: windows

  # Dependency checks against the committed Cargo.lock: RustSec advisories
  # (vulnerable, unsound, unmaintained or yanked crates), licenses, bans and
  # sources, as configured in deny.toml.
  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # Prebuilt binaries, checksum-verified by the action, so nothing is compiled.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings
      # THIRD_PARTY_LICENSES ships in every release archive and the container
      # image, so it must match Cargo.lock. After a dependency change, run
      # `python3 third-party/notices.py` and commit the result.
      - run: python3 third-party/notices.py --check

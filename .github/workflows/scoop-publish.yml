# Custom cargo-dist publish job: push the Scoop manifest to the bucket.
#
# `scoop bucket add vericto https://github.com/vericto/scoop-bucket` then
# `scoop install vericto/vericto`. The bucket is a repo of our own, like the
# Homebrew tap, not Scoop's `extras`: a release reaches it as soon as it is
# approved, and the manifest is ours to review (DESIGN.md §9, "Windows
# channels"). The manifest (windows/package.js scoop) pins both Windows
# archives (x64, ARM64) by the release's SHA-256, and carries checkver and
# autoupdate, so it can also go to `extras` later unchanged.
#
# Same shape as homebrew-publish.yml: SCOOP_BUCKET_TOKEN, which can write to
# the bucket repo only, lives in the reviewer-gated `prod` environment, and
# this reusable workflow declares `environment: prod` to read it. Until the
# owner creates the bucket repo and sets the token, the job succeeds without
# publishing and says so (a notice on the run), so releases are not blocked.
# Referenced from dist-workspace.toml as `publish-jobs = [..., "./scoop-publish"]`.
name: Publish Scoop manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  scoop-publish:
    runs-on: ubuntu-22.04
    environment: prod
    # The workflow's GITHUB_TOKEN is not used to push (SCOOP_BUCKET_TOKEN is).
    permissions:
      contents: read
    env:
      PLAN: ${{ inputs.plan }}
      BUCKET: vericto/scoop-bucket
    steps:
      # Only whether the token is set reaches the shell, never its value.
      - name: Check for the bucket token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scoop not published::SCOOP_BUCKET_TOKEN is not set in the prod environment, so the Scoop bucket was not updated. See DESIGN.md section 9, Windows channels."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.enabled == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            windows
            npm-installer
      # The token is used for the fetch, not persisted; the push passes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.enabled == 'true'
        with:
          repository: ${{ env.BUCKET }}
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket
          persist-credentials: false
      - name: Fetch the release checksums
        if: steps.token.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: dist-artifacts/
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.enabled == 'true'
        with:
          node-version: '20.x'
      # Fails, and publishes nothing, if either Windows archive has no
      # checksum in sha256.sum / its .sha256, or the two disagree.
      - name: Write the manifest
        if: steps.token.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test -s dist-artifacts/sha256.sum || { echo "::error::sha256.sum missing from the release artifacts"; exit 1; }
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "vericto-cli") | .app_version')
          mkdir -p bucket/bucket
          node windows/package.js scoop dist-artifacts "$version" bucket/bucket/vericto.json
          jq -e --arg v "$version" '.version == $v and (.architecture | length) == 2' bucket/bucket/vericto.json > /dev/null
      - name: Push the manifest to the bucket
        if: steps.token.outputs.enabled == 'true'
        working-directory: bucket
        run: |
          set -euo pipefail
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "vericto-cli") | .app_version')
          git config user.name "Vericto"
          git config user.email "295450070+vericto@users.noreply.github.com"
          git add bucket/vericto.json
          git diff --cached --quiet || git commit -m "vericto ${version}"
          git push "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/${BUCKET}.git" HEAD:main
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

# Custom cargo-dist publish job: publish the npm package.
#
# Why a custom job instead of the built-in `publish-jobs = ["npm"]`? The
# NPM_TOKEN lives in the `prod` GitHub Environment (required-reviewer gated,
# since this is a public repo). The built-in job runs without an `environment:`,
# so it can't read an environment-scoped secret. A reusable workflow that
# declares `environment: prod` at the job level resolves that secret locally
# (environment secrets aren't inheritable via the caller — they must be read by
# a job that sets the environment). Referenced from dist-workspace.toml as
# `publish-jobs = ["./npm-publish"]`; regenerated into release.yml by `dist
# generate`, so it survives regeneration.
name: Publish npm package

on:
  workflow_call:
    # cargo-dist passes the release plan (same JSON as dist-manifest.json) so we
    # can find the built npm tarball(s) to publish.
    inputs:
      plan:
        required: true
        type: string

jobs:
  npm-publish:
    runs-on: ubuntu-22.04
    # Gates the publish behind the `prod` environment (required reviewer) and,
    # crucially, makes the environment-scoped NPM_TOKEN available to this job.
    environment: prod
    # contents: read for the checkout of npm-installer/; id-token: write for
    # npm provenance. Granted by the caller (dist-workspace.toml,
    # github-custom-job-permissions), which bounds what this job can get.
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      # Only npm-installer/ is used from the checkout: the integrity-checking
      # installer and the script that puts it in the package.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: npm-installer
      - name: Fetch npm packages and the release checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: dist-artifacts/
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Test the installer
        working-directory: npm-installer
        run: npm test
      # The generated package downloads the prebuilt binary on install. Before
      # publishing, pin every platform archive by the SHA-256 the release
      # publishes and swap in the installer that refuses a mismatch
      # (npm-installer/harden-package.js). Fails the publish if any archive has
      # no checksum.
      - name: Pin the binaries by SHA-256
        run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            node npm-installer/harden-package.js "./dist-artifacts/${pkg}" ./dist-artifacts
          done
      # --provenance publishes a Sigstore-signed statement that this package was
      # built by this workflow from this commit (shown on npmjs.com).
      - name: Publish to npm
        run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public --provenance "./dist-artifacts/${pkg}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

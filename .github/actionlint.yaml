# actionlint configuration (https://github.com/rhysd/actionlint).
paths:
  # Generated by cargo-dist (`dist generate`): hand edits are overwritten and
  # make `dist plan` fail, so its shellcheck style notes are not fixed here.
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:info'
      - 'shellcheck reported issue in this script: SC2129:style'

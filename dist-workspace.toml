[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. `npm` publishes an @vericto/cli package
# whose postinstall fetches the matching prebuilt binary from the GitHub release
# (§9 Phase 2) — zero-install in CI via `npx @vericto/cli` since runners have Node.
installers = ["shell", "npm"]
# npm scope for the generated package → published as @vericto/cli.
npm-scope = "@vericto"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"

# NOTE: `github-attestations` (keyless build provenance, §9) is intentionally
# OFF: GitHub artifact attestations are not available for user-owned PRIVATE
# repos — the release job's Attest step fails with "Feature not available for
# user-owned private repositories." Re-enable (add `github-attestations = true`
# and re-run `dist generate`) once this repo is public or moved under an org.
# Until then, releases ship SHA-256 checksums (`sha256.sum` + per-artifact
# `.sha256`) for integrity.

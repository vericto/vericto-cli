[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. `npm` publishes an @vericto/vericto-cli
# package whose postinstall fetches the matching prebuilt binary from the GitHub
# release (§9 Phase 2) — zero-install in CI via `npx @vericto/vericto-cli`.
# `homebrew` builds a `vericto.rb` formula (macOS arm64/x86_64 and Linux
# arm64/x86_64, the latter served by the static musl archives) pinned to the
# release's SHA-256 checksums: `brew install vericto/tap/vericto`.
# No "powershell": cargo-dist 0.32's PowerShell installer does not verify what
# it downloads (its shell installer does). Windows gets
# vericto-cli-installer.ps1 from the custom global job below instead: the
# cargo-dist installer plus SHA-256 pinning (windows/installer.ps1).
installers = ["shell", "npm", "homebrew"]
# The tap the formula is published to (github.com/vericto/homebrew-tap, tapped
# as `vericto/tap`), and the formula name: `vericto`, the installed command,
# rather than the crate name `vericto-cli`.
tap = "vericto/homebrew-tap"
formula = "vericto"
# npm scope for the generated package → published as @vericto/vericto-cli.
npm-scope = "@vericto"
# Publish the npm package automatically as part of the release via a CUSTOM
# publish job (.github/workflows/npm-publish.yml). Not the built-in "npm" job:
# publishing is gated by the `prod` GitHub Environment (reviewer-gated, public
# repo), which the built-in job doesn't declare. It authenticates with npm
# Trusted Publishing (OIDC), so there is no npm token.
# The Homebrew formula is pushed to the tap the same way, by a CUSTOM job
# (.github/workflows/homebrew-publish.yml) rather than the built-in "homebrew"
# one: HOMEBREW_TAP_TOKEN, which can write to the tap, lives in `prod` too, and
# the built-in job declares no environment, so it could only read a repository
# secret that any workflow in this public repo can reach. (With the tap set and
# the built-in job off, `dist plan` warns that the Homebrew publish job is
# disabled; that is expected.)
# Scoop and winget the same way (.github/workflows/scoop-publish.yml and
# winget-publish.yml), each with its token in `prod`. Both skip, and say so,
# while their token is not set: the bucket repo and the first winget
# submission are owner steps (DESIGN.md §9, "Windows channels").
publish-jobs = ["./npm-publish", "./homebrew-publish", "./scoop-publish", "./winget-publish"]
# Runs once the binaries are built, next to cargo-dist's own global artifacts
# (installers, checksums): renders the PowerShell installer with every Windows
# archive's SHA-256 pinned, and installs the release with it on Windows before
# anything is published (.github/workflows/powershell-installer.yml). Its
# output is part of the release from the start, and every PR runs it too.
global-artifacts-jobs = ["./powershell-installer"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Shipped in every archive next to the binary, with the README, LICENSE and
# CHANGELOG that dist adds on its own: NOTICE (copyright, license, the embedded
# engine) and THIRD_PARTY_LICENSES (third-party/notices.py; CI checks it is
# current).
include = ["NOTICE", "THIRD_PARTY_LICENSES"]
# On a pull request, build every target and upload the archives as workflow
# artifacts (nothing is published or released): each PR is a release dry run.
# The default, "plan", only runs `dist plan`, which never compiles anything, so
# a toolchain break (libclang on the musl runners, pg_query on a new target)
# would first show up after the tag. Set back to "plan" to save runner time.
pr-run-mode = "upload"
# "upload" turns on build caching, which adds an unpinned rust-cache action to
# release.yml. Release builds stay uncached: every artifact is built from
# clean, and every action in release.yml stays pinned to a SHA (see below).
cache-builds = false

# Keyless build provenance (§9): each artifact gets a Sigstore-backed GitHub
# attestation tying it to this repo, the workflow and the commit, verifiable with
# `gh attestation verify <artifact> --repo vericto/vericto-cli`. Was off while
# the repo was a user-owned private one, where GitHub does not offer the feature;
# the repo is public under the vericto org since 2026-08-01. SHA-256 checksums
# (`sha256.sum` + per-artifact `.sha256`) still ship alongside.
github-attestations = true

# Offline mode (DESIGN §13) embeds vericto-engine, whose pg_query runs
# bindgen at build time: the Linux runners need libclang and clang's own headers
# (`stdbool.h`; libclang-dev alone lacks them, seen in a Debian builder), macOS
# runners get both with Xcode. The Windows runners (windows-2022, windows-11-arm)
# ship LLVM and MSVC, so they need nothing extra.
# Windows on ARM builds natively on GitHub's windows-11-arm runner (free for
# public repos; Visual Studio with the ARM64 tools, LLVM and Rust preinstalled),
# so pg_query compiles and bindgen runs for the host, as on every other target.
# dist itself runs there as its x64 build, under emulation (cargo-dist ships no
# ARM64 Windows binary; its installer picks the x64 one).
[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "windows-11-arm"
host = "aarch64-pc-windows-msvc"

# macOS on Apple silicon builds on macos-15, not dist 0.32's default macos-14:
# GitHub retires the macOS 14 images on 2026-11-02 (actions/runner-images#13518)
# and fails macos-14 jobs during its brownouts until then. Intel macOS keeps
# dist's default, macos-15-intel (GA, not deprecated), where it builds
# natively like every other target.
[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-15"

[dist.dependencies.apt]
libclang-dev = { version = "*", targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"] }
clang = { version = "*", targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"] }

# The custom npm publish job (.github/workflows/npm-publish.yml) checks out
# npm-installer/ and publishes with npm provenance: it needs contents: read and
# id-token: write, and nothing else (no packages: write; it publishes to npmjs).
[dist.github-custom-job-permissions]
"npm-publish" = { contents = "read", id-token = "write" }
# The custom Homebrew job (.github/workflows/homebrew-publish.yml) only reads
# this run's artifacts and pushes to the tap with HOMEBREW_TAP_TOKEN; it needs
# nothing from the workflow's GITHUB_TOKEN beyond contents: read.
"homebrew-publish" = { contents = "read" }
# Scoop pushes to the bucket repo with SCOOP_BUCKET_TOKEN, winget opens its PR
# on microsoft/winget-pkgs with WINGET_TOKEN, and the PowerShell installer job
# only reads this run's artifacts: none of them uses the GITHUB_TOKEN to write.
"scoop-publish" = { contents = "read" }
"winget-publish" = { contents = "read" }
"powershell-installer" = { contents = "read" }

# Every action in the generated release.yml is pinned to a full commit SHA, not
# a movable tag: dist writes these into the workflow on `dist generate`. Bump
# them here (same major as dist expects) and regenerate; Dependabot does not
# touch release.yml (see .github/dependabot.yml), since a hand edit there makes
# `dist plan` fail on the stale file.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2

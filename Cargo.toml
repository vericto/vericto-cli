[package]
name = "vericto-cli"
version = "1.13.1"
edition = "2021"
rust-version = "1.88"
description = "Validate SQL against your Vericto workspace's security rules before it runs"
license = "FSL-1.1-ALv2"
homepage = "https://vericto.com"
repository = "https://github.com/vericto/vericto-cli"

# The installed command is `vericto`, not `vericto-cli`.
[[bin]]
name = "vericto"
path = "src/main.rs"

[dependencies]
# CLI parsing with derive.
clap = { version = "4.5", features = ["derive", "env"] }
# Shell completion script generation (`vericto completions <shell>`).
clap_complete = "4.5"
# HTTP client (rustls to avoid a system OpenSSL dependency in CI images).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Colored human output; honors NO_COLOR automatically.
anstream = "0.6"
anstyle = "1"
# Config file (~/.config/vericto/config.toml) parsing + serialization.
toml = "0.8"
# Cross-platform config directory resolution.
dirs = "5"
# Offline Ed25519 verification of signed run receipts (§7.1). `pem` reads the
# published PEM public key; no private-key / signing capability is used.
ed25519-dalek = { version = "2", features = ["pem"] }
# SHA-256 digest the Ed25519 signature is computed over (scheme ed25519-sha256).
sha2 = "0.10"
# Decodes the base64 signature carried in the receipt.
base64 = "0.22"
# CSPRNG for the browser-login `state` parameter (§6, "verified login") — the
# OS RNG directly, no `rand` crate needed for "give me N random bytes".
# Already present transitively (rustls/ring); pinning it as a direct dep keeps
# `cargo audit`/SBOM tooling honest about who actually uses it.
getrandom = "0.2"
# Pinned by tag, like vericto-proxy and vericto-eval: an engine release is a
# CLI release (the tag bump is the ruleset bump for offline mode). Offline
# mode takes its rules, version and decision from the engine (src/offline.rs).
# Built on every release target, Windows included since 1.11.0.
vericto-engine = { git = "https://github.com/vericto/vericto-engine", tag = "v4.7.1", optional = true }

[features]
default = ["offline"]
# `vericto check --offline` (DESIGN §13): evaluate locally with the embedded
# engine and its standard rules at default severities. Pulls in
# `vericto-engine`, whose `pg_query` builds libpg_query's C sources and runs
# bindgen, so building needs a C compiler and libclang. Without the feature the
# CLI is the thin client it has always been, and `--offline` exits 2.
offline = ["dep:vericto-engine"]

[dev-dependencies]
# HTTP mocking for the API-client tests (in-process wiremock server).
wiremock = "0.6"
# Spawn the built binary in integration tests (exercises the run_* commands).
assert_cmd = "2"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

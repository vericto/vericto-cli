# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/), run by
# the `supply-chain` job in .github/workflows/ci.yml and locally with
# `cargo deny check`.

[graph]
# The graph as the binary is built: default features, every target.
all-features = false

[advisories]
# Every RustSec vulnerability, unsound, unmaintained and yanked advisory fails
# the check. An exception goes in `ignore` with the advisory id and the reason,
# and is revisited when the dependency is next bumped.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# The licenses the dependency tree uses today. A dependency under any other
# license fails the check until it has been reviewed and added here. Vericto's
# own crates are in `exceptions` below, so a third-party dependency under a
# source-available license still fails.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: accepted for this one crate, used unmodified
# (dirs -> dirs-sys -> option-ext), not as a blanket allowance.
# AGPL-3.0-only is Vericto's own license: accepted for this crate and for the
# engine it embeds (vericto-engine 5.0.0 and later), not for any third party:
# Vericto dual-licenses its own crates, and a third-party AGPL dependency would
# bind the binary to the AGPL with no commercial option. Engine releases up to
# v4.7.1 are FSL-1.1-ALv2 and are not accepted any more: the pin must stay on
# 5.0.0 or later.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["AGPL-3.0-only"], crate = "vericto-cli" },
    { allow = ["AGPL-3.0-only"], crate = "vericto-engine" },
]

[bans]
# Duplicate versions are reported, not failed.
multiple-versions = "warn"
# A git dependency (the engine, for offline mode) counts as a wildcard; the
# sources section below restricts it to the engine's repository, by tag.
wildcards = "warn"
allow-wildcard-paths = true
# TLS is rustls only (see Cargo.toml): no OpenSSL in the binary.
deny = [
    { crate = "openssl", reason = "TLS is rustls only" },
    { crate = "openssl-sys", reason = "TLS is rustls only" },
]

[sources]
# Crates come from crates.io, plus the engine (offline mode) from its public
# repository, pinned by tag — as in vericto-proxy.
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "tag"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/vericto/vericto-engine"]
